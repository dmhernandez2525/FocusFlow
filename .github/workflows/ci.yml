name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check packages
        run: |
          cd packages/types && pnpm tsc --noEmit
          cd ../../packages/utils && pnpm tsc --noEmit

      - name: Run tests
        run: cd services/web && pnpm test -- --forceExit --coverage

      - name: Build
        run: cd services/web && pnpm build
